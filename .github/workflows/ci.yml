name: CI

# Upstream-style: test + embedProxyJar on main/PRs.
# Fork note: some GitHub fork accounts only fire workflow_dispatch for GHA
# until "Enable Actions" is confirmed in the UI; we also listen to `create`
# (tag created) and `release` so tag/release packaging still works.
on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "vAT*"
      - "VAT*"
  pull_request:
    branches: [main]
  # Fires when a branch or tag is created (covers tag push when `push` is filtered)
  create:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip noise: branch-create events (we only want tags via `create`)
    if: >
      github.event_name != 'create'
      || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # attach JAR to a GitHub Release

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build extension JAR
        # Same entrypoint as BappManifest BuildCommand / official docs
        run: ./gradlew embedProxyJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload extension JAR (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burp-mcp-extension
          path: build/libs/burp-mcp-*.jar
          retention-days: 30
          if-no-files-found: error

      - name: Publish / update GitHub Release assets
        # Tag ref (push/create/dispatch-on-tag) or a published release
        if: >
          startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'release'
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          files: build/libs/burp-mcp-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Build

            CI-built fat JAR (`burp-mcp-all.jar`).

            - Java 21 (Temurin)
            - Tasks: `./gradlew test embedProxyJar`
            - Includes embedded `mcp-proxy-all.jar` (stdio proxy)

            Load in Burp: **Extensions → Add → Java →** the attached JAR.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    # Upstream job; many forks have Dependency graph disabled → don't fail the whole CI
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0